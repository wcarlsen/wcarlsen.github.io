[project]
site_name = "wcarlsen's blog"
site_url = "https://wcarlsen.github.io/"
site_description = "My personal blog"
repo_name = "wcarlsen/wcarlsen.github.io"
repo_url = "https://github.com/wcarlsen/wcarlsen.github.io"
extra_javascript = ["https://unpkg.com/magic-snowflakes/dist/snowflakes.auto.min.js"]

[project.theme]
features = [
  "header.autohide",
  "content.code.copy",
]
logo = "assets/logo.png"
font.text = "JetBrains Mono"
font.code = "JetBrains Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
# Palette toggle for automatic mode
media = "(prefers-color-scheme)"
accent = "light green"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
# Palette toggle for light mode
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "light green"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
# Palette toggle for dark mode
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "light green"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[project.plugins.blog]
blog_dir = "."
blog_toc = true
post_url_format = "{file}"
authors = false

[project.plugins.search]

[project.plugins.tags]

[project.plugins.rss]
match_path = "posts/.*"
abstract_chars_count = -1
date_from_meta.as_creation = "date"

[project.plugins.optimize]

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github-alt"
link = "https://github.com/wcarlsen"
name = "wcarlsen"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/wcarlsen/"

[[project.extra.social]]
icon = "fontawesome/brands/instagram"
link = "https://www.instagram.com/willicarl/"

[project.markdown_extensions]
attr_list = {}
footnotes = {}
"pymdownx.emoji".emoji_index = "zensical.extensions.emoji.twemoji"
"pymdownx.emoji".emoji_generator = "zensical.extensions.emoji.to_svg"
"pymdownx.highlight".linenums = true
"pymdownx.highlight".anchor_linenums = true
"pymdownx.highlight".line_spans = "__span"
"pymdownx.highlight".pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
